<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flag Battle Royale — 150 Nations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{
    color:#eef1ff;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:6px;
    background-color:#03040f;
    background-image:
      radial-gradient(1.6px 1.6px at 8% 12%,#fff,transparent 60%),
      radial-gradient(1.2px 1.2px at 22% 38%,#fff,transparent 60%),
      radial-gradient(1px 1px at 38% 8%,#fff,transparent 60%),
      radial-gradient(1.4px 1.4px at 52% 55%,#fff,transparent 60%),
      radial-gradient(1px 1px at 68% 22%,#fff,transparent 60%),
      radial-gradient(1.6px 1.6px at 82% 68%,#fff,transparent 60%),
      radial-gradient(1px 1px at 14% 78%,#fff,transparent 60%),
      radial-gradient(1.3px 1.3px at 90% 42%,#fff,transparent 60%),
      radial-gradient(1px 1px at 33% 88%,#fff,transparent 60%),
      radial-gradient(1.2px 1.2px at 62% 82%,#fff,transparent 60%),
      radial-gradient(ellipse 55% 40% at 20% 8%,rgba(120,60,190,.14),transparent 70%),
      radial-gradient(ellipse 60% 45% at 82% 85%,rgba(40,130,210,.13),transparent 70%),
      radial-gradient(ellipse 45% 35% at 90% 12%,rgba(220,90,120,.09),transparent 70%),
      radial-gradient(circle at 50% 8%,#10153a 0%,#080b24 45%,#03040f 100%);
    background-repeat:repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,no-repeat,no-repeat,no-repeat,no-repeat;
    background-size:220px 220px,220px 220px,180px 180px,240px 240px,200px 200px,260px 260px,190px 190px,210px 210px,230px 230px,250px 250px,100% 100%,100% 100%,100% 100%,100% 100%;
  }
  h1{
    font-family:'Orbitron','Segoe UI',Arial,sans-serif;font-weight:900;font-size:21px;letter-spacing:2.5px;
    text-align:center;margin:4px 0 5px;text-transform:uppercase;
    background:linear-gradient(90deg,#ffe27a,#ffd447 30%,#ff9f43 55%,#7ce0ff 85%,#39d0ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 8px rgba(255,212,71,.5)) drop-shadow(0 0 18px rgba(120,220,255,.32));
  }
  #royaleBtn{cursor:pointer;border-bottom:1px dashed rgba(255,212,71,.5);padding-bottom:1px}
  #royaleBtn:active{opacity:.7}
  #wrap{position:relative;width:100%;max-width:640px;margin:0 auto}
  @media (max-height:780px){ #wrap{max-width:330px} }
  @media (max-height:680px){ #wrap{max-width:270px} }
  @media (max-height:600px){ #wrap{max-width:220px} }
  #c{display:block;width:100%;border-radius:12px}
  #confettiC{pointer-events:none;position:absolute;inset:0;width:100%;height:100%;border-radius:12px}
  #winnerBanner{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,8,20,.88);border-radius:12px;z-index:30;text-align:center}
  #winnerBanner.show{display:flex}
  #winnerBanner .title{font-size:12px;opacity:.7;letter-spacing:2px;margin-bottom:4px}
  #podium{display:flex;align-items:flex-end;gap:6px;margin-top:4px}
  .pb{display:flex;flex-direction:column;align-items:center}
  .pb .fl{font-size:30px}
  .bar{width:50px;border-radius:5px 5px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:3px;font-weight:800;font-size:12px;color:#20200a}
  .bar.gold{height:80px;background:linear-gradient(180deg,#ffe27a,#ffb400)}
  .bar.silver{height:55px;background:linear-gradient(180deg,#eef1f5,#b9c2cc)}
  .bar.bronze{height:38px;background:linear-gradient(180deg,#e0a374,#a9673a)}
  .pn{font-size:10px;margin-top:2px;opacity:.85}
  .pb .fl img{animation:podBounce 1.1s ease-in-out infinite}
  .pb.winner .fl img{animation:podCrown 1s ease-in-out infinite;box-shadow:0 0 22px rgba(255,212,71,.9)}
  .pn{font-size:10px;margin-top:3px;color:#eef1ff;max-width:92px;line-height:1.1;text-align:center}
  .pb.winner .pn{color:#ffd447;font-weight:800}
  @keyframes podBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.08)}}
  @keyframes podCrown{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.18) rotate(-2deg)}}
  button{flex:1;min-width:70px;padding:8px 10px;border:none;border-radius:7px;font-weight:700;font-size:12px;cursor:pointer;background:#ffd447;color:#20200a}
  #settOverlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;align-items:flex-end;justify-content:center}
  #settOverlay.show{display:flex}
  #settPanel{background:#101a3a;width:100%;max-width:640px;border-radius:14px 14px 0 0;padding:12px;max-height:65vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,.07)}
  #settPanel h3{font-size:13px;color:#ffd447;display:flex;justify-content:space-between;margin-bottom:6px}
  .sr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}
  .sr input[type=range]{flex:1;max-width:160px}
  .sv{min-width:28px;text-align:right;opacity:.7;font-size:11px}
  .ticker{width:100%;max-width:640px;margin:0 auto 4px;background:#101a3a;border-radius:8px;padding:4px 6px 5px;border:1px solid rgba(120,220,255,.1);box-shadow:inset 0 0 20px rgba(60,200,255,.05)}
  .ticker h3{font-size:11px;color:#ffd447;margin-bottom:3px;letter-spacing:.5px}
  .ticker.elim{border-color:rgba(255,90,80,.18);box-shadow:inset 0 0 20px rgba(255,90,80,.06)}
  .qRow{position:relative;height:20px;overflow:hidden;margin:2px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .qRowInner{display:inline-flex;gap:5px;position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
  .qRowInner img{width:28px;height:18px;object-fit:cover;border-radius:3px;border:1px solid rgba(120,220,255,.3);box-shadow:0 0 5px rgba(60,200,255,.25);flex:0 0 auto}
  .ticker.elim .qRowInner img{filter:grayscale(1) contrast(1.05) brightness(.85);border-color:rgba(255,120,110,.35);box-shadow:0 0 5px rgba(255,60,60,.2)}
  .qRow.empty::after{content:'—';display:block;text-align:center;opacity:.25;font-size:10px;line-height:20px}

  #startRow{display:flex;align-items:flex-end;justify-content:center;gap:18px;width:100%;max-width:640px;margin:4px auto}
  #startBtn{flex:none;position:relative;width:50px;height:50px;border-radius:50%;border:2px solid rgba(120,220,255,.4);background:radial-gradient(circle at 50% 35%,#182451,#0b1230);box-shadow:0 0 14px rgba(120,220,255,.25),inset 0 0 10px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:visible;padding:0;transition:box-shadow .2s,border-color .2s}
  #startBtn.isRunning{border-color:rgba(255,159,67,.75);box-shadow:0 0 18px rgba(255,140,60,.45),inset 0 0 10px rgba(0,0,0,.4)}
  #startBtn svg{position:relative;z-index:2;width:24px;height:36px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  #thrust{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;justify-content:center;gap:2px;opacity:0;transition:opacity .15s;pointer-events:none}
  #startBtn.isRunning #thrust{opacity:1}
  #thrust .fl{width:4px;height:11px;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#fff6c8,#ff9f43 55%,#ff5e3a);transform-origin:top center;animation:flicker .3s ease-in-out infinite}
  #thrust .f2{height:17px;animation-delay:.07s}
  #thrust .f3{height:10px;animation-delay:.14s}
  @keyframes flicker{0%,100%{transform:scaleY(1) scaleX(1);opacity:.85}50%{transform:scaleY(1.4) scaleX(.75);opacity:1}}
  #qualifyPopup{
    position:absolute;top:50%;left:50%;z-index:40;display:flex;flex-direction:column;align-items:center;
    transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;text-align:center;
    padding:12px 22px;border-radius:14px;background:rgba(7,11,26,.88);border:2px solid #ffd447;
    box-shadow:0 6px 30px rgba(0,0,0,.7);max-width:88vw;
  }
  #qpopSub{font-size:11px;opacity:.75;letter-spacing:1px;margin-bottom:6px;color:#7ce0ff}
  #qpopDesc{max-width:250px;font-size:12px;line-height:1.55;color:#eef1ff;opacity:.92}
  #qualifyPopup.show{transform:translate(-50%,-50%) scale(1);opacity:1;animation:qpop .45s cubic-bezier(.18,1.6,.4,1)}
  #qualifyPopup.hide-anim{transition:opacity .4s,transform .4s;opacity:0;transform:translate(-50%,-50%) scale(.8)}
  @keyframes qpop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #qpopFlag{width:84px;height:56px;object-fit:cover;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.5)}
  .champFlagWrap{position:relative;display:inline-block;animation:champPop .8s cubic-bezier(.18,1.6,.4,1)}
  .champFlagWrap img{width:150px;height:100px;object-fit:cover;border-radius:10px;box-shadow:0 0 0 4px rgba(255,212,71,.9),0 0 44px rgba(255,196,60,.55),0 10px 26px rgba(0,0,0,.6)}
  @keyframes champPop{0%{transform:scale(0) rotate(-10deg)}55%{transform:scale(1.14) rotate(4deg)}75%{transform:scale(.96) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
  .champSpark{position:absolute;font-size:20px;color:#ffe27a;text-shadow:0 0 8px rgba(255,224,138,.9);animation:champSparkle 1.15s ease-in-out infinite;pointer-events:none}
  @keyframes champSparkle{0%,100%{opacity:0;transform:scale(.3) rotate(0deg)}50%{opacity:1;transform:scale(1.2) rotate(25deg)}}
  #qpopName{margin-top:8px;font-size:16px;font-weight:800;color:#ffd447;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #qpopLbl{font-size:10px;opacity:.7;letter-spacing:1.5px;margin-top:2px;text-transform:uppercase}
</style>
</head>
<body>
<h1>THE FLAG BATTLE <span id="royaleBtn">ROYALE</span></h1>
<div id="qualifiedTicker" class="ticker">
  <h3>🏁 Qualified <span id="bracketCount">(0)</span></h3>
  <div class="qRow empty"><div class="qRowInner" id="qRow0"></div></div>
  <div class="qRow empty"><div class="qRowInner" id="qRow1"></div></div>
  <div class="qRow empty"><div class="qRowInner" id="qRow2"></div></div>
</div>
<div id="wrap">
  <canvas id="c" width="640" height="640"></canvas>
  <canvas id="confettiC" width="640" height="640"></canvas>
  <div id="winnerBanner">
    <div class="title">🏆 CHAMPION 🏆</div>
    <div id="podium"></div>
  </div>
  <div id="qualifyPopup">
    <div id="qpopLbl">Qualified</div>
    <div id="qpopBody" style="display:flex;flex-direction:column;align-items:center;justify-content:center"></div>
  </div>
</div>
<div id="startRow">
  <button id="startBtn" aria-label="Start or stop the battle">
    <svg viewBox="0 0 40 60" width="34" height="52" aria-hidden="true">
      <path d="M20 2 C29 13 31 26 31 36 L9 36 C9 26 11 13 20 2 Z" fill="#e7ecf8"/>
      <path d="M20 2 C29 13 31 26 31 36 L24 36 C24 24 23 12 20 2 Z" fill="#c3cde2"/>
      <circle cx="20" cy="20" r="5.2" fill="#39d0ff"/>
      <circle cx="20" cy="20" r="5.2" fill="none" stroke="#0d3a4d" stroke-width="1.2"/>
      <path d="M9 30 L1 46 L9 40 Z" fill="#ff9f43"/>
      <path d="M31 30 L39 46 L31 40 Z" fill="#ff9f43"/>
      <rect x="13" y="35" width="14" height="7" rx="1.5" fill="#ffd447"/>
    </svg>
    <div id="thrust"><span class="fl f1"></span><span class="fl f2"></span><span class="fl f3"></span></div>
  </button>
</div>
<div id="elimTicker" class="ticker elim">
  <h3>📝 Eliminated <span id="elimCount">(0)</span></h3>
  <div class="qRow empty"><div class="qRowInner" id="eRow0"></div></div>
  <div class="qRow empty"><div class="qRowInner" id="eRow1"></div></div>
  <div class="qRow empty"><div class="qRowInner" id="eRow2"></div></div>
</div>
<div id="settOverlay">
  <div id="settPanel">
    <h3>⚙️ Settings <button onclick="document.getElementById('settOverlay').classList.remove('show')" style="background:none;border:none;color:#fff;font-size:17px;cursor:pointer">✕</button></h3>
    <div class="sr"><span>Gap size</span><input type="range" id="gapSz" min="8" max="60" value="26"><span class="sv" id="gapSzV">26°</span></div>
    <div class="sr"><span>Gap speed</span><input type="range" id="gapSp" min="-300" max="300" value="60"><span class="sv" id="gapSpV">60</span></div>
    <div class="sr"><span>Gravity</span><input type="range" id="grav" min="0" max="60" value="0"><span class="sv" id="gravV">0</span></div>
    <div class="sr"><span>Ball speed</span><input type="range" id="ballSp" min="1" max="10" value="4"><span class="sv" id="ballSpV">4</span></div>
    <div class="sr"><span>Simulation mode</span>
      <select id="simMode" onchange="readCtrls()" style="flex:1;max-width:180px;padding:4px;border-radius:6px;border:1px solid #333;background:#0c1230;color:#fff">
        <option value="normal">Normal</option>
        <option value="fast">Accelerated</option>
      </select></div>
    <div class="sr"><span>Sound effects</span><label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="snd" checked onchange="soundOn=this.checked"> <span id="sndV">On</span></label></div>
    <button onclick="readCtrls();document.getElementById('settOverlay').classList.remove('show')" style="width:100%;margin-top:6px">✅ Close</button>
  </div>
</div>

const FLAG_IMG_CACHE={};
for(const code of FLAG_CODES){const img=new Image();img.src=FLAG_IMGS[code];FLAG_IMG_CACHE[code]=img;}
// ===== SETUP =====
const C=document.getElementById('c'),CX=320,CY=320,R=290;
const TURRET_L={x:CX-90,y:CY+R+8}, TURRET_R={x:CX+90,y:CY+R+8};
const TURRET_TL={x:CX-90,y:CY-R-8}, TURRET_TR={x:CX+90,y:CY-R-8};
const TURRETS=[TURRET_L,TURRET_R,TURRET_TL,TURRET_TR];
const FX=C.getContext('2d');
const C2=document.getElementById('confettiC'),FX2=C2.getContext('2d');
// ===== STATE =====
let phase='idle',allN=[],qPool=[],qualified=[],knockoutPool=[],sessionPool=[],survivors3=[],podium=[],podiumOrder=[],balls=[],gaps=[0],gapA=0,simT=0;
let mode='normal',boost=false;
// ===== SOUND EFFECTS (Web Audio, synthesized) =====
let actx=null,soundOn=true,lastBounce=0,lastScrape=0;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function beep(freq,dur,type,vol,when){
  if(!soundOn||!actx)return;
  if(actx.state==='suspended')actx.resume(); // mobile browsers can suspend the shared context when speechSynthesis grabs audio focus
  const t=actx.currentTime+(when||0);
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+0.02);
}
function playBounce(){const n=performance.now();if(n-lastBounce<90)return;lastBounce=n;beep(200+Math.random()*70,0.05,'triangle',0.04)}
function playScrape(){const n=performance.now();if(n-lastScrape<80)return;lastScrape=n;beep(150+Math.random()*300,0.09,'sawtooth',0.035)}
function playQualify(){beep(523,0.13,'triangle',0.11);beep(659,0.13,'triangle',0.11,0.1);beep(784,0.26,'triangle',0.12,0.2)}
function playFanfare(){[523,659,784,1046].forEach((f,i)=>beep(f,0.3,'triangle',0.13,i*0.13));beep(1318,0.7,'triangle',0.13,0.55)}
function playPhase(){beep(392,0.12,'triangle',0.1);beep(523,0.18,'triangle',0.1,0.1)}
let gapW=26*Math.PI/180,gapSp=60*Math.PI/180,grav=0,nGaps=4,simM=1;
let running=false,elimLog=[],lt=null,particles=[],sparks=[],lasers=[],wallClock=0,lastElimNotified=0;

function rnd(a,b){return a+Math.random()*(b-a)}
function shf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function initTournament(){
  allN=FLAGS.map((f,i)=>({id:i,flag:f,code:FLAG_CODES[i]}));shf(allN);
  qPool=allN.slice();qualified=[];knockoutPool=[];sessionPool=[];survivors3=[];podium=[];podiumOrder=[];elimLog=[];gapA=0;simT=0;wallClock=0;sparks=[];particles=[];lasers=[];fireworks=[];lastQualifiedRender=-1;lastElimRender=-1;
}
function readGaps(b){gaps=[];for(let i=0;i<nGaps;i++)gaps.push(b+i*(Math.PI*2/nGaps))}
function angDiff(a,b){let d=a-b;return Math.atan2(Math.sin(d),Math.cos(d))}

function mkBalls(grp,spd){
  const a=[];let r=grp.length>100?13:(grp.length>40?18:(grp.length>10?28:36));
  for(const n of grp){
    const ang=rnd(0,Math.PI*2),rad=rnd(0,R-r-10);
    const dir=rnd(0,Math.PI*2);
    a.push({n,x:CX+Math.cos(ang)*rad,y:CY+Math.sin(ang)*rad,vx:Math.cos(dir)*spd*30,vy:Math.sin(dir)*spd*30,r,alive:true,c:`hsl(${(n.id*47)%360},70%,60%)`});
  }
  for(let it=0;it<200;it++){let m=false;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const A=a[i],B=a[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),md=A.r+B.r+2;if(d<md&&d>0.001){const o=(md-d)/2,nx=dx/d,ny=dy/d;A.x-=nx*o;A.y-=ny*o;B.x+=nx*o;B.y+=ny*o;m=true}}if(!m)break}
  return a
}

function ballSpd(){return +document.getElementById('ballSp').value}
function enterPhase(){
  elimLog=[]; lastElimNotified=0; lastElimRender=-1;
  if(phase==='qualify'){ nGaps=4; balls=mkBalls(qPool,ballSpd()); }
  else if(phase==='knockout'){ nGaps=2; balls=mkBalls(knockoutPool,ballSpd()); }
  else if(phase==='podium'){ nGaps=1; balls=mkBalls(survivors3,ballSpd()); }
  readGaps(gapA); setRunning(true);
}
function setRunning(v){ running=v; updateStartBtn(); }
function updateStartBtn(){
  const btn=document.getElementById('startBtn');
  if(!btn) return;
  btn.classList.toggle('isRunning',running);
}

// per-gap open state: qualify = always open (breathing pulse);
// podium = single gap, opens 2s every 10s; knockout = 2 gaps, each 10s open / 5s closed (15s cycle), gap1 offset 5s so at least one is always open.
function gapOpenState(idx){
  if(phase==='qualify'){
    const breathe=0.62+0.38*Math.sin(simT*1.6);
    return {open:true, w:(boost?85*Math.PI/180:gapW)*breathe};
  }
  const pulse=0.7+0.3*Math.sin(simT*3);
  if(phase==='podium'){
    const isOpen=(wallClock%10)<2.0;
    return {open:isOpen, w:isOpen?gapW*pulse:0};
  }
  // knockout
  const period=15, dur=10, offset=idx*5;
  const isOpen=(((wallClock-offset)%period)+period)%period < dur;
  return {open:isOpen, w:isOpen?gapW*pulse:0};
}
function checkGapHit(a,gapStates){
  for(let i=0;i<gaps.length;i++){
    const st=gapStates[i];
    if(st.open && Math.abs(angDiff(a,gaps[i]))<st.w/2) return true;
  }
  return false;
}
const ESCAPE_DELAY=0.45, HOVER_R=R+20;
function fireLaser(b){
  let turret=TURRETS[0],best=Infinity;
  for(const t of TURRETS){ const d=Math.hypot(b.x-t.x,b.y-t.y); if(d<best){best=d;turret=t;} }
  lasers.push({x1:turret.x,y1:turret.y,x2:b.x,y2:b.y,life:0.22,max:0.22});
  spawnSparks(b.x,b.y,10,'#ff3b3b');
  playZap();
  b.alive=false;
  elimLog.push(b.n);
}
function playZap(){beep(900,0.05,'sawtooth',0.06);beep(480,0.08,'sawtooth',0.05,0.03)}
function step(dt){
  if(popupBusy) return;
  simT+=dt;
  const sp=((boost&&phase==='qualify')?gapSp*6:gapSp);
  gapA+=sp*dt; readGaps(gapA);
  const gapStates=gaps.map((g,i)=>gapOpenState(i));
  const alive=balls.filter(b=>b.alive);
  const fighters=alive.filter(b=>!b.escaping);
  const escaping=alive.filter(b=>b.escaping);
  // knockout & podium run clean 2x speed (no tail speed-up); qualification keeps tail boost
  const sc=(phase==='qualify')?(fighters.length<=3?18:(fighters.length<=6?9:(fighters.length<=12?4:1))):1;
  for(const b of fighters){
    b.vy+=grav*dt*20;b.x+=b.vx*dt*sc;b.y+=b.vy*dt*sc;
    const dx=b.x-CX,dy=b.y-CY,dist=Math.hypot(dx,dy);
    if(dist+b.r>R){
      const a=Math.atan2(dy,dx);
      if(checkGapHit(a,gapStates)){
        // every phase now escapes through the gap and gets finalized by a turret laser (fireLaser)
        const spd=Math.hypot(b.vx,b.vy)||150;
        b.vx=Math.cos(a)*spd*1.25; b.vy=Math.sin(a)*spd*1.25;
        b.escaping=true; b.escT=0; b.laserFired=false;
      }
      else{const nx=dx/dist,ny=dy/dist,o=(dist+b.r)-R;b.x-=nx*o;b.y-=ny*o;const dot=b.vx*nx+b.vy*ny;b.vx-=2*dot*nx;b.vy-=2*dot*ny;playBounce()}
    }
  }
  for(const b of escaping){
    b.escT+=dt;
    const dx=b.x-CX,dy=b.y-CY,dist=Math.hypot(dx,dy)||1;
    if(dist<HOVER_R){ b.x+=b.vx*dt; b.y+=b.vy*dt; }
    else{ const nx=dx/dist,ny=dy/dist; b.x=CX+nx*HOVER_R; b.y=CY+ny*HOVER_R; }
    if(!b.laserFired && b.escT>=ESCAPE_DELAY){ b.laserFired=true; fireLaser(b); }
  }
  const lst=balls.filter(b=>b.alive&&!b.escaping);
  for(let i=0;i<lst.length;i++)for(let j=i+1;j<lst.length;j++){
    const a=lst[i],b=lst[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),md=a.r+b.r;
    if(d<md&&d>1e-4){const nx=dx/d,ny=dy/d,o=(md-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const rv=b.vx-a.vx,rv2=b.vy-a.vy,v=rv*nx+rv2*ny;if(v<0){a.vx+=v*nx;a.vy+=v*ny;b.vx-=v*nx;b.vy-=v*ny;playScrape();spawnSparks((a.x+b.x)/2,(a.y+b.y)/2,(phase==='podium'?7:3))}}
  }
  const left=balls.filter(b=>b.alive);
  // Qualification: one round until LAST survivor qualifies
  if(phase==='qualify' && left.length<=1){
    const winner=left[0]?left[0].n:elimLog[elimLog.length-1];
    qualified.push(winner);
    qPool=qPool.filter(n=>n!==winner);
    renderG();
    setRunning(false); // pause so the player focuses on the qualified flag
    showPopup([winner],'QUALIFIED',()=>{
      if(qualified.length>=75){
        knockoutPool=qualified.slice();
        updateHUD();
        showPhaseIntro('knockout',()=>{ phase='knockout'; enterPhase(); });
      } else {
        updateHUD(); enterPhase();
      }
    });
    return;
  }
  // Knockout: continuous battle 75 -> 3. Notify each disqualified (2s, no pause/restart).
  if(phase==='knockout'){
    if(elimLog.length>lastElimNotified){
      notifyFlag(elimLog[elimLog.length-1],'DISQUALIFIED');
      lastElimNotified=elimLog.length;
    }
    if(left.length<=3 && left.length>=1){
      survivors3=left.map(b=>b.n);
      updateHUD();
      speak(`Standing round locked in. Advancing to the podium: ${survivors3.map(n=>NAME_MAP[n.code]||n.code).join(', ')}. Prepare for the final stand.`);
      showPopup(survivors3,'FINAL 3',()=>{
        showPhaseIntro('podium',()=>{ phase='podium'; enterPhase(); });
      },true);
      return;
    }
  }
  // Podium: continuous 3 -> 1 champion
  if(phase==='podium'){
    if(elimLog.length>lastElimNotified){
      notifyFlag(elimLog[elimLog.length-1],'DISQUALIFIED');
      lastElimNotified=elimLog.length;
    }
    if(left.length<=1 && left.length>=1){
      const champ=left[0]?left[0].n:elimLog[elimLog.length-1];
      const second=elimLog.length>=1?elimLog[elimLog.length-1]:champ;
      const third=elimLog.length>=2?elimLog[elimLog.length-2]:second;
      podium=[champ,second,third];
      phase='done'; setRunning(false); updateHUD();
      speak(`We have a champion! ${NAME_MAP[champ.code]||champ.code} takes the crown of the Flag Battle Royale! Congratulations, champion.`);
      showPopup([champ],'🏆 CHAMPION',()=>{ showPodium(); },true);
      return;
    }
  }
  updateHUD();
}

const STARS=[];

function nebula(ctx,x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function drawGalaxy(ctx){
  const g=ctx.createRadialGradient(320,120,40,320,320,470);
  g.addColorStop(0,'#10153a');g.addColorStop(0.5,'#080b24');g.addColorStop(1,'#03040f');
  ctx.fillStyle=g;ctx.fillRect(0,0,640,640);
  nebula(ctx,170,150,170,'rgba(120,60,190,0.10)');
  nebula(ctx,450,490,190,'rgba(40,130,210,0.10)');
  nebula(ctx,520,150,130,'rgba(220,90,120,0.07)');
  initStars();
  ctx.save();
  for(const s of STARS){
    ctx.globalAlpha=0.35+0.65*(0.5+0.5*Math.sin(simT*s.sp+s.ph));
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}
function drawShipArena(ctx){
  const segs=200;
  const gapStates=gaps.map((g,i)=>gapOpenState(i));
  const inG=(a)=>{
    for(let i=0;i<gaps.length;i++){ const st=gapStates[i]; if(st.open && Math.abs(angDiff(a,gaps[i]))<st.w/2) return true; }
    return false;
  };
  // outer energy halo
  let halo=ctx.createRadialGradient(CX,CY,R-10,CX,CY,R+20);
  halo.addColorStop(0,'rgba(60,210,255,0)');halo.addColorStop(0.6,'rgba(60,200,255,0.14)');halo.addColorStop(1,'rgba(60,200,255,0)');
  ctx.fillStyle=halo;ctx.beginPath();ctx.arc(CX,CY,R+20,0,Math.PI*2);ctx.fill();
  // spaceship hull ring (annulus R..R+9), skip gap
  for(let i=0;i<segs;i++){
    const a0=(i/segs)*Math.PI*2,a1=((i+1)/segs)*Math.PI*2,am=(a0+a1)/2;
    if(inG(am)) continue;
    const o0x=CX+Math.cos(a0)*R,o0y=CY+Math.sin(a0)*R,o1x=CX+Math.cos(a1)*R,o1y=CY+Math.sin(a1)*R;
    const i0x=CX+Math.cos(a0)*(R+9),i0y=CY+Math.sin(a0)*(R+9),i1x=CX+Math.cos(a1)*(R+9),i1y=CY+Math.sin(a1)*(R+9);
    ctx.beginPath();ctx.moveTo(o0x,o0y);ctx.lineTo(i0x,i0y);ctx.lineTo(i1x,i1y);ctx.lineTo(o1x,o1y);ctx.closePath();
    ctx.fillStyle=(i%2===0)?'rgba(26,46,66,0.92)':'rgba(22,40,58,0.92)';ctx.fill();
    ctx.strokeStyle='rgba(20,38,54,0.6)';ctx.lineWidth=0.5;ctx.stroke();
    // glint outer edge
    ctx.strokeStyle='rgba(130,220,255,0.6)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(o0x,o0y);ctx.lineTo(o1x,o1y);ctx.stroke();
  }
  // pulsing energy rail at inner ring (R+9)
  const pulse=0.55+0.45*Math.sin(simT*3);
  ctx.strokeStyle=`rgba(70,220,255,${0.25+0.4*pulse})`;ctx.lineWidth=2;ctx.beginPath();let st=false;
  for(let i=0;i<=segs;i++){const a=(i/segs)*Math.PI*2;if(inG(a)){st=false;continue}const x=CX+Math.cos(a)*(R+9),y=CY+Math.sin(a)*(R+9);if(!st){ctx.moveTo(x,y);st=true}else ctx.lineTo(x,y)}
  ctx.stroke();
  // running lights (pulsing cockpit blips)
  for(let i=0;i<16;i++){
    const am=i/16*Math.PI*2; if(inG(am)) continue;
    const lx=CX+Math.cos(am)*(R+4.5),ly=CY+Math.sin(am)*(R+4.5);
    const la=0.4+0.6*(0.5+0.5*Math.sin(simT*(2+(i%3))+i*1.3));
    ctx.fillStyle=`rgba(120,235,255,${la})`;ctx.beginPath();ctx.arc(lx,ly,1.7,0,Math.PI*2);ctx.fill();
  }
  // gap = open hatch with glowing doorway (amber/yellow lamps)
  gaps.forEach((g,gi)=>{
    const ew=gapStates[gi].w;
    const gx=CX+Math.cos(g)*R,gy=CY+Math.sin(g)*R;
    let gg=ctx.createRadialGradient(gx,gy,0,gx,gy,30);
    gg.addColorStop(0,'rgba(255,204,60,0.22)');gg.addColorStop(1,'rgba(255,204,60,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(gx,gy,30,0,Math.PI*2);ctx.fill();
    for(const e of [g-ew/2,g+ew/2]){
      const dx=CX+Math.cos(e)*R,dy=CY+Math.sin(e)*R;
      ctx.fillStyle='rgba(255,225,80,1)';ctx.beginPath();ctx.arc(dx,dy,2.8,0,Math.PI*2);ctx.fill();
    }
    // hatch glow arc
    ctx.strokeStyle='rgba(255,204,60,0.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,R-2,g-ew/2,g+ew/2);ctx.stroke();
  });
}
function drawTurret(ctx,x,y,mirror,flipY){
  ctx.save();

  ctx.scale(mirror?-1:1,flipY?-1:1);

function draw(){
  const ctx=FX;

  // Balls - actual flag images (rectangular)
  for(const b of balls){

    const x=b.x-w2/2, y=b.y-h2/2;

// Continuous ticker: a monotonically-increasing `pos` per row (never reset) is taken modulo the
// current content width every frame (stepTickers). Content can be regenerated at any time (new
// flag appended) without ever resetting `pos`, so already-scrolling flags never jump/restart —
// only the CONTENT changes, the scroll position flows through it seamlessly.
const TICKER_SPEED=42; // px/s
const tickerRows={};
function renderTicker(list,prefix,countId){
  document.getElementById(countId).textContent=`(${list.length})`;
  const rows=[[],[],[]];
  list.forEach((n,i)=>rows[i%3].push(n));
  for(let r=0;r<3;r++){
    const rowId=prefix+r;
    const row=document.getElementById(rowId);
    const container=row.parentElement; // .qRow
    const items=rows[r];
    container.classList.toggle('empty',items.length===0);
    const st=tickerRows[rowId]||(tickerRows[rowId]={pos:0,expandedWidth:0,dir:(r===1)?1:-1});
    if(!items.length){ row.innerHTML=''; st.expandedWidth=0; continue; }
    const singleHtml=items.map(n=>`<img src="${FLAG_IMGS[n.code]}" title="${NAME_MAP[n.code]||n.code}">`).join('');
    row.innerHTML=singleHtml; // measure one copy first
    const containerW=container.clientWidth||300, singleWidth=row.scrollWidth||1;
    const repeats=Math.max(1,Math.ceil(containerW/singleWidth)); // pad so it always fills the box
    const expandedHtml=singleHtml.repeat(repeats);
    row.innerHTML=expandedHtml+expandedHtml; // two copies back-to-back for a seamless loop
    st.expandedWidth=singleWidth*repeats;
  }
}
function stepTickers(dt){
  for(const rowId in tickerRows){
    const st=tickerRows[rowId];
    if(!st.expandedWidth) continue;
    st.pos+=TICKER_SPEED*dt;
    const row=document.getElementById(rowId);
    if(!row) continue;
    const m=st.pos%st.expandedWidth;
    row.style.transform=`translateX(${st.dir<0?-m:(m-st.expandedWidth)}px)`;
  }
}

function renderLog(){ if(elimLog.length===lastElimRender)return; lastElimRender=elimLog.length; renderTicker(elimLog,'eRow','elimCount'); }

function spawnSparks(x,y,n,color){

function renderEffects(dt){
  FX2.clearRect(0,0,640,640);
  // collision sparks (rollerblade-style)
  if(sparks.length){
    for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;const al=Math.max(0,s.l/0.45);FX2.globalAlpha=al;FX2.strokeStyle=s.c;FX2.lineWidth=1.6;FX2.beginPath();FX2.moveTo(s.x,s.y);FX2.lineTo(s.x-s.vx*0.03,s.y-s.vy*0.03);FX2.stroke();}
    FX2.globalAlpha=1; sparks=sparks.filter(s=>s.l>0);
  }
  // red laser beams (turret hits)
  if(lasers.length){
    for(const l of lasers){
      l.life-=dt;const al=Math.max(0,l.life/l.max);
      FX2.globalAlpha=al;FX2.strokeStyle='#ff3b3b';FX2.shadowColor='#ff3b3b';FX2.shadowBlur=10;FX2.lineWidth=3;
      FX2.beginPath();FX2.moveTo(l.x1,l.y1);FX2.lineTo(l.x2,l.y2);FX2.stroke();FX2.shadowBlur=0;
    }
    FX2.globalAlpha=1; lasers=lasers.filter(l=>l.life>0);
  }
  // fireworks (champion celebration)
  if(fireworks.length){
    for(const p of fireworks){
      p.l-=dt; if(p.l<=0) continue;
      p.vy+=90*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      const al=Math.max(0,p.l/p.max);
      FX2.globalAlpha=al; FX2.fillStyle=p.c;
      FX2.beginPath();FX2.arc(p.x,p.y,2.2,0,Math.PI*2);FX2.fill();
      FX2.strokeStyle=p.c;FX2.lineWidth=1.2;FX2.beginPath();FX2.moveTo(p.x,p.y);FX2.lineTo(p.x-p.vx*0.02,p.y-p.vy*0.02);FX2.stroke();
    }
    FX2.globalAlpha=1; fireworks=fireworks.filter(p=>p.l>0);
  }
  // confetti (podium celebration)
  if(particles.length){
    for(const p of particles){p.l-=dt;if(p.l<=0)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;p.r+=p.vr*dt;FX2.save();FX2.translate(p.x,p.y);FX2.rotate(p.r*Math.PI/180);FX2.fillStyle=p.c;FX2.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);FX2.restore()}
    particles=particles.filter(p=>p.l>0);
  }
}

// ===== VOICE-OVER (SpeechSynthesis) — normal female announcer voice, no FX =====
let voiceList=null;
function refreshVoices(){ voiceList=window.speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  refreshVoices();
  window.speechSynthesis.onvoiceschanged=refreshVoices;
}
function unlockSpeech(){
  // must be called synchronously inside a real user-gesture handler so later, code-triggered
  // speak() calls are still allowed to play on strict mobile browsers (iOS Safari, etc).
  if(!('speechSynthesis' in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(' ');
    u.volume=0.01; u.rate=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function pickVoice(){
  const voices=(voiceList&&voiceList.length)?voiceList:((window.speechSynthesis&&window.speechSynthesis.getVoices())||[]);
  if(!voices.length) return null;
  const byName=re=>voices.find(v=>re.test(v.name));
  return byName(/Samantha|Zira|Karen|Victoria|Moira|Tessa|Female|Google US English|Google UK English Female/i)
    || voices.find(v=>/en/i.test(v.lang)) || voices[0];
}
function speak(text){
  if(!soundOn||!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1; u.pitch=1; u.volume=1;
    const v=pickVoice(); if(v)u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

    <div style="margin-top:6px;font-size:14px;font-weight:800;color:#ffd447">${NAME_MAP[n.code]||n.code}</div>`;
  const p=document.getElementById('qualifyPopup');
  p.classList.remove('show','hide-anim'); void p.offsetWidth; p.classList.add('show');
  if(notifTimer)clearTimeout(notifTimer);
  notifTimer=setTimeout(()=>{ if(!p.classList.contains('show'))return; p.classList.add('hide-anim'); setTimeout(()=>p.classList.remove('show','hide-anim'),400); },2000);
}
function showPopup(items,label,onDone,forcePause){
  document.getElementById('qpopLbl').textContent=label||'';
  const body=document.getElementById('qpopBody');
  if(!items||items.length===0){body.innerHTML='';}
  else if(items.length===1&&(label||'').indexOf('CHAMPION')!==-1){
    const n=items[0];
    const sparkPos=[[-14,-10],[102,-6],[-12,88],[104,84],[46,-16]];
    const sparks=sparkPos.map((pos,i)=>`<span class="champSpark" style="top:${pos[1]}%;left:${pos[0]}%;animation-delay:${(i*0.17).toFixed(2)}s">${i%2?'✧':'✦'}</span>`).join('');
    body.innerHTML=`<div class="champFlagWrap">${sparks}<img src="${FLAG_IMGS[n.code]}"></div>
      <div style="margin-top:12px;font-size:20px;font-weight:800;color:#ffd447;letter-spacing:.5px;text-shadow:0 1px 4px rgba(0,0,0,.7)">${NAME_MAP[n.code]||n.code}</div>`;
    playQualify();
  }else if(items.length===1){
    const n=items[0];
    body.innerHTML=`<img src="${FLAG_IMGS[n.code]}" style="width:88px;height:59px;object-fit:cover;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.5)">
      <div style="margin-top:8px;font-size:17px;font-weight:800;color:#ffd447;letter-spacing:.5px;text-shadow:0 1px 3px rgba(0,0,0,.6)">${NAME_MAP[n.code]||n.code}</div>`;
    playQualify();
  }else{
    playPhase();
    body.innerHTML=`<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:280px;padding:6px 4px">`+items.map(n=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;max-width:58px">
      <img src="${FLAG_IMGS[n.code]}" style="width:48px;height:32px;object-fit:cover;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.5)">
      <div style="font-size:8px;line-height:1.05;text-align:center;opacity:.92;color:#eef1ff">${NAME_MAP[n.code]||n.code}</div></div>`).join('')+`</div>`;
  }
  const p=document.getElementById('qualifyPopup');
  p.classList.remove('show','hide-anim');
  void p.offsetWidth; // restart pop animation
  p.classList.add('show');
  const shouldPause = forcePause || !boost;
  if(shouldPause){
    popupBusy=true;
    if(qpopTimer)clearTimeout(qpopTimer);
    qpopTimer=setTimeout(()=>{
      p.classList.add('hide-anim');
      setTimeout(()=>{p.classList.remove('show','hide-anim');popupBusy=false;onDone&&onDone();},450);
    },3000);
  }else{
    // boosted / fast: don't block the flow
    if(onDone) onDone();
  }
}
// Init
readCtrls();initTournament();renderG();renderLog();draw();requestAnimationFrame(loop);
</script>
